            background-repeat:no-repeat;
           background-attachment:fixed;
           background-size:cover;
        }
        header {
           background-color: #4CAF50;
            color: #fff;
            padding: 20px 0;

            text-shadow: #fff 1px 1px 2px;

        footer {
            background-color: #333;
            color: #fff;

            padding: 10px 0;
            position: fixed;

</html>
